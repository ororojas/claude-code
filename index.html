<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        .main-game {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #gameCanvas {
            flex: 1;
            background: radial-gradient(circle at 50% 50%, #0f3460 0%, #0a1929 100%);
            border: 3px solid #e94560;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .chip-selector {
            display: flex;
            gap: 8px;
        }

        .chip {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
            transition: all 0.2s;
        }

        .chip:hover {
            transform: scale(1.1);
            border-color: white;
        }

        .chip.active {
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .chip-10 { background: #8B0000; }
        .chip-25 { background: #1E90FF; }
        .chip-50 { background: #FF8C00; }
        .chip-100 { background: #FFD700; }

        .control-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #ff6b7f;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .players-panel {
            width: 280px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .players-title {
            color: #e94560;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
        }

        .player-item {
            background: rgba(233, 69, 96, 0.1);
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 8px;
            padding: 12px;
            color: white;
            transition: all 0.3s;
        }

        .player-item.active {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .player-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .player-chips {
            font-size: 13px;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .player-bets {
            font-size: 12px;
            color: #87ceeb;
            word-break: break-word;
        }

        .add-player {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .add-player input {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #e94560;
            border-radius: 4px;
            color: white;
            font-size: 12px;
        }

        .add-player input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .add-player button {
            padding: 8px 12px;
            font-size: 12px;
        }

        .status-message {
            text-align: center;
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            min-height: 30px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #e94560;
            text-align: center;
            color: white;
            min-width: 300px;
        }

        .modal-content h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .modal-result {
            font-size: 18px;
            margin: 20px 0;
            color: #87ceeb;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }

            .players-panel {
                width: 100%;
                max-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-game">
            <canvas id="gameCanvas"></canvas>

            <div class="status-message" id="statusMessage">Place your bets!</div>

            <div class="controls">
                <div class="chip-selector" id="chipSelector">
                    <div class="chip chip-10 active" data-value="10">$10</div>
                    <div class="chip chip-25" data-value="25">$25</div>
                    <div class="chip chip-50" data-value="50">$50</div>
                    <div class="chip chip-100" data-value="100">$100</div>
                </div>

                <div class="control-buttons">
                    <button id="spinBtn">🎰 SPIN WHEEL</button>
                    <button id="resetBtn">Reset</button>
                    <button id="clearBetsBtn">Clear Bets</button>
                </div>
            </div>
        </div>

        <div class="players-panel">
            <div class="players-title">Players</div>
            <div id="playersList"></div>

            <div class="add-player">
                <input type="text" id="playerNameInput" placeholder="Player name">
                <button id="addPlayerBtn">Add</button>
            </div>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>Spin Result</h2>
            <div id="resultNumber" class="modal-result">Number: 17</div>
            <div id="resultWinners" class="modal-result">Congrats!</div>
            <div class="modal-buttons">
                <button id="closeResultBtn">Next Spin</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusMessage = document.getElementById('statusMessage');
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const clearBetsBtn = document.getElementById('clearBetsBtn');
        const addPlayerBtn = document.getElementById('addPlayerBtn');
        const playerNameInput = document.getElementById('playerNameInput');
        const playersList = document.getElementById('playersList');
        const chipSelector = document.getElementById('chipSelector');
        const resultModal = document.getElementById('resultModal');
        const resultNumber = document.getElementById('resultNumber');
        const resultWinners = document.getElementById('resultWinners');
        const closeResultBtn = document.getElementById('closeResultBtn');

        let selectedChipValue = 10;
        let isSpinning = false;
        let gameState = {
            players: [],
            bets: {}, // { playerId: { number: value, ... } }
            wheelRotation: 0,
            ballX: 0,
            ballY: 0,
            ballVelX: 0,
            ballVelY: 0,
            ballOnWheel: false,
            ballRadius: 8,
            wheelRadius: 200,
            wheelCenterX: 0,
            wheelCenterY: 0
        };

        const WHEEL_NUMBERS = [0, 26, 3, 35, 12, 28, 7, 29, 18, 22, 9, 31, 14, 20, 1, 33, 16, 24, 5, 10, 23, 8, 30, 11, 36, 13, 27, 6, 34, 17, 25, 2, 21, 4, 19, 15, 32];
        const RED_NUMBERS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            gameState.wheelCenterX = canvas.width / 2;
            gameState.wheelCenterY = canvas.height / 2;
            gameState.wheelRadius = Math.min(canvas.width, canvas.height) * 0.3;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        chipSelector.addEventListener('click', (e) => {
            if (e.target.classList.contains('chip')) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedChipValue = parseInt(e.target.dataset.value);
            }
        });

        addPlayerBtn.addEventListener('click', () => {
            const name = playerNameInput.value.trim();
            if (name) {
                gameState.players.push({
                    id: Date.now(),
                    name: name,
                    chips: 500,
                    bets: {}
                });
                playerNameInput.value = '';
                updatePlayersList();
            }
        });

        clearBetsBtn.addEventListener('click', () => {
            gameState.players.forEach(p => p.bets = {});
            updatePlayersList();
        });

        spinBtn.addEventListener('click', () => {
            if (isSpinning || gameState.players.length === 0) return;
            spinWheel();
        });

        resetBtn.addEventListener('click', () => {
            gameState.players = [];
            gameState.players.forEach(p => p.bets = {});
            updatePlayersList();
        });

        canvas.addEventListener('click', (e) => {
            if (isSpinning) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dx = x - gameState.wheelCenterX;
            const dy = y - gameState.wheelCenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > gameState.wheelRadius * 0.9 || distance < gameState.wheelRadius * 0.1) return;

            // Get the angle and find which number was clicked
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            const normalizedAngle = (angle + 90 + gameState.wheelRotation + 360) % 360;
            const numberIndex = Math.floor((normalizedAngle / 360) * WHEEL_NUMBERS.length);
            const number = WHEEL_NUMBERS[numberIndex];

            // Add bet for current player
            if (gameState.players.length > 0) {
                const currentPlayer = gameState.players[gameState.players.length - 1];
                if (!currentPlayer.bets[number]) {
                    currentPlayer.bets[number] = 0;
                }
                currentPlayer.bets[number] += selectedChipValue;
                currentPlayer.chips -= selectedChipValue;
                updatePlayersList();
                statusMessage.textContent = `Bet $${selectedChipValue} on ${number}`;
            }
        });

        function updatePlayersList() {
            playersList.innerHTML = gameState.players.map((player, idx) => `
                <div class="player-item ${idx === gameState.players.length - 1 ? 'active' : ''}">
                    <div class="player-name">${player.name}</div>
                    <div class="player-chips">💰 $${player.chips}</div>
                    <div class="player-bets">
                        ${Object.entries(player.bets).length > 0
                            ? Object.entries(player.bets).map(([num, val]) => `${num}: $${val}`).join(', ')
                            : 'No bets'}
                    </div>
                </div>
            `).join('');
        }

        function drawWheel() {
            const cx = gameState.wheelCenterX;
            const cy = gameState.wheelCenterY;
            const r = gameState.wheelRadius;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(gameState.wheelRotation * Math.PI / 180);

            const numberCount = WHEEL_NUMBERS.length;
            const anglePerNumber = 360 / numberCount;

            for (let i = 0; i < numberCount; i++) {
                const angle = (i * anglePerNumber) * Math.PI / 180;
                const nextAngle = ((i + 1) * anglePerNumber) * Math.PI / 180;
                const number = WHEEL_NUMBERS[i];
                const isRed = RED_NUMBERS.includes(number);

                // Draw pocket
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, r, angle - Math.PI / 2, nextAngle - Math.PI / 2);
                ctx.closePath();
                ctx.fillStyle = number === 0 ? '#2d5016' : (isRed ? '#c41e3a' : '#000');
                ctx.fill();
                ctx.strokeStyle = '#daa520';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw number
                const midAngle = (angle + nextAngle) / 2;
                const numX = Math.cos(midAngle) * (r * 0.7);
                const numY = Math.sin(midAngle) * (r * 0.7);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(number, numX, numY);
            }

            // Draw wheel border
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#daa520';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Draw center
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#daa520';
            ctx.fill();

            ctx.restore();

            // Draw ball pointer
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.moveTo(cx, cy - r - 30);
            ctx.lineTo(cx - 12, cy - r - 15);
            ctx.lineTo(cx + 12, cy - r - 15);
            ctx.closePath();
            ctx.fill();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(gameState.ballX, gameState.ballY, gameState.ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#f0f0f0';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Ball shine
            ctx.beginPath();
            ctx.arc(gameState.ballX - 2, gameState.ballY - 2, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fill();
        }

        function spinWheel() {
            isSpinning = true;
            spinBtn.disabled = true;
            statusMessage.textContent = 'Spinning...';

            const spinDuration = 4000; // 4 seconds
            const startTime = Date.now();
            const startRotation = gameState.wheelRotation;
            const spins = 5 + Math.random() * 3;
            const finalRotation = spins * 360 + Math.random() * 360;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3); // Ease out

                gameState.wheelRotation = startRotation + finalRotation * easeProgress;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    gameState.wheelRotation = gameState.wheelRotation % 360;
                    determineWinner();
                }
            }

            animate();
        }

        function determineWinner() {
            const normalizedRotation = gameState.wheelRotation % 360;
            const numberIndex = Math.floor((normalizedRotation / 360) * WHEEL_NUMBERS.length);
            const winningNumber = WHEEL_NUMBERS[numberIndex];

            const winners = [];
            gameState.players.forEach(player => {
                if (player.bets[winningNumber]) {
                    const winAmount = player.bets[winningNumber] * 36; // Simple payout
                    player.chips += winAmount;
                    winners.push({ name: player.name, amount: winAmount });
                }
                player.bets = {};
            });

            resultNumber.textContent = `Number: ${winningNumber} ${RED_NUMBERS.includes(winningNumber) ? '🔴' : '⚫'}`;

            if (winners.length > 0) {
                resultWinners.textContent = winners
                    .map(w => `${w.name} wins $${w.amount}!`)
                    .join(' | ');
            } else {
                resultWinners.textContent = 'No winners this round';
            }

            statusMessage.textContent = `The ball landed on ${winningNumber}!`;
            updatePlayersList();
            resultModal.classList.add('active');
        }

        closeResultBtn.addEventListener('click', () => {
            resultModal.classList.remove('active');
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background
            ctx.fillStyle = 'rgba(10, 25, 41, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawWheel();

            if (gameState.ballOnWheel) {
                gameState.ballX = gameState.wheelCenterX;
                gameState.ballY = gameState.wheelCenterY - gameState.wheelRadius + 30;
            }

            drawBall();

            requestAnimationFrame(animate);
        }

        // Add sample players
        gameState.players.push(
            { id: 1, name: 'Player 1', chips: 500, bets: {} },
            { id: 2, name: 'Player 2', chips: 500, bets: {} }
        );
        updatePlayersList();

        animate();
    </script>
</body>
</html>
